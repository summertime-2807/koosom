name: ทดสอบบอท LINE

on:
  workflow_run:
    workflows: ['Deploy LINE bot (Cloudflare Worker)']
    types: [completed]
  workflow_dispatch:
    inputs:
      cmds:
        description: 'คำสั่งคั่นด้วย , (ว่าง = ทุกคำสั่ง)'
        default: ''

permissions:
  contents: read

jobs:
  selftest:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: ทดสอบทุกคำสั่ง
        working-directory: app
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          CMDS: ${{ github.event.inputs.cmds }}
        run: |
          [ -z "$CMDS" ] && unset CMDS
          sleep 10
          npx tsx scripts/selftest.ts
