name: Deploy LINE bot (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - app/worker/**
      - app/src/**
      - app/wrangler.toml
      - .github/workflows/line-bot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: ยังไม่ได้ตั้งค่า Cloudflare
        if: env.HAS_CF != 'true'
        run: echo "ใส่ secret CLOUDFLARE_API_TOKEN และ CLOUDFLARE_ACCOUNT_ID ก่อน — ข้าม"
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: env.HAS_CF == 'true'
        working-directory: app
      - name: เตรียม KV (เก็บ token Google Health)
        if: env.HAS_CF == 'true'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() { npx wrangler kv namespace list 2>/dev/null | jq -r '.[] | select(.title=="koosom-kv" or .title=="raceplan-line-bot-koosom-kv") | .id' | head -1; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler kv namespace create koosom-kv >/dev/null; ID=$(find_id); fi
          [ -n "$ID" ] || { echo "สร้าง KV ไม่สำเร็จ"; exit 1; }
          sed -i "s/__KV_ID__/$ID/" wrangler.toml
          echo "KV พร้อม"
      - name: Deploy Worker + secrets
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          packageManager: npm
          secrets: |
            LINE_CHANNEL_ACCESS_TOKEN
            LINE_CHANNEL_SECRET
            LINE_USER_ID
            INTERVALS_ATHLETE_ID
            INTERVALS_API_KEY
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      - name: ใส่ secret ของ Google Health (ถ้ามี)
        if: env.HAS_CF == 'true'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID >/dev/null
            printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET >/dev/null
            echo "ใส่ secret Google แล้ว"
          else
            echo "ยังไม่มี GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET — ข้าม"
          fi
