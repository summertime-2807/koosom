name: ตั้งเมนู LINE (Rich menu)

on:
  push:
    branches: [main]
    paths:
      - app/assets/richmenu.png
      - app/assets/richmenu-badminton.png
      - app/scripts/richmenu.ts
      - .github/workflows/richmenu.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  richmenu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: สร้างและตั้งเมนู
        working-directory: app
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: npx tsx scripts/richmenu.ts
      - name: ผูกเมนูแบดให้ผู้ใช้โหมดแบด
        working-directory: app
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: npx tsx scripts/relink.ts
