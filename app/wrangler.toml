name = "raceplan-line-bot"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# โค้ช AI (Cloudflare Workers AI · ฟรีวันละ 10,000 neurons)
[ai]
binding = "AI"

# เก็บ refresh token ของ Google Health (id ใส่ให้อัตโนมัติตอน deploy)
[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

# ทุก 2 ชม.: ดึงการนอนจาก Google Health + ตรวจว่าเพิ่งตื่น → ส่ง "☀️ ตื่นแล้ว"
[triggers]
crons = ["15 */2 * * *"]
